{% extends  'parent/base.html'%}
{%block head%}<h4>contact_us</h4>{% endblock%}
{%block title%}contact us{% endblock%}
{%block content%}
<div>
    {% if messages%}
    {% for i in messages%}<meta http-equiv="refresh" content="3;{% url 'first_app:contact'%}">{{i}}{%endfor%}
    {%endif%}
<form method="POST" class="">
    {% csrf_token%}
    <label class="form-label">first_name:</label>
    <input type="text" name="first_name" class="form-control"><br>
    <label class="form-label">last_name:</label>
    <input type="text" name="last_name"  class="form-control"><br>
    <label class="form-label">criticisms:</label>
    <input type="text" name="criticisms"  class="form-control"><br>
    <label class="form-label">email:</label>
    <input type="email" name="email"  class="form-control"><br>
    <button type="submit" class="btn btn-primary btn-sm">save</button>

</form>
</div>
{%endblock%}
