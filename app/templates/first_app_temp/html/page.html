<div class="d-flex justify-content-center gap-3 align-item-center" >
    {% if page.has_previous%}<a href="?page={{page.previous_page_number}}" class="btn btn-info rounded-pill">
    previous</a>
    {%endif%}
page {{page.number}} of {{page.paginator.num_pages}}
{% if page.has_next%}<a href="?page={{page.next_page_number}}" class="btn btn-info rounded-pill">next</a>{%endif%}<br>
    </div>
<div class=" d-flex justify-content-center me-2">
    {% for i in page.paginator.page_range%}
    {% if i == page.number %}
    <span class="mx-3 fw-bold">{{i}}</span>
    {%else%}
    {{i}}
    {%endif%}
    {%endfor%}
    </div>
